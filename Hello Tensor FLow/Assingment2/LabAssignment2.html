<!DOCTYPE html>
<html>
<head>
<title>Vector Operations</title>

<!-- Math.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>

<style>
body{
  font-family: Arial;
  text-align:center;
  margin-top:80px;
}

button{
  padding:10px 15px;
  margin:10px;
  font-size:16px;
  cursor:pointer;
}

#output{
  margin-top:20px;
  font-size:18px;
}
</style>

</head>
<body>

<h2>Vector Operations</h2>

<button onclick="showVectors()">Show Vectors</button>
<button onclick="addVectors()">Addition</button>
<button onclick="multiplyVectors()">Multiplication</button>

<div id="output"></div>

<script>

let vector1 = [1,2,3];
let vector2 = [4,5,6];

function showVectors(){
  document.getElementById("output").innerHTML =
  "Vector 1: " + vector1 + "<br>Vector 2: " + vector2;
}

function addVectors(){
  let addition = math.add(vector1, vector2);
  document.getElementById("output").innerHTML =
  "Element-wise Addition: " + addition;
}

function multiplyVectors(){
  let multiplication = math.dotMultiply(vector1, vector2);
  document.getElementById("output").innerHTML =
  "Element-wise Multiplication: " + multiplication;
}

</script>

</body>
</html>
