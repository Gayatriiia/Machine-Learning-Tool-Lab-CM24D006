<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MobileNet Image Classifier</title>

  <!-- TensorFlow.js and MobileNet via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: #ffffff;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 22px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 13px;
      color: #888;
      margin-bottom: 1.5rem;
    }

    /* Status badge */
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 12px;
      border-radius: 99px;
      margin-bottom: 1.5rem;
    }
    .badge-loading { background: #f0f0f0; color: #888; }
    .badge-ready   { background: #d4edda; color: #155724; }
    .badge-busy    { background: #cce5ff; color: #004085; }

    /* Drop zone */
    .drop-zone {
      border: 2px dashed #cbd5e0;
      border-radius: 12px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
      margin-bottom: 1.25rem;
    }
    .drop-zone:hover { background: #f7fafc; border-color: #3182ce; }
    .drop-zone .icon { font-size: 36px; margin-bottom: 8px; }
    .drop-zone p  { font-size: 14px; color: #555; }
    .drop-zone small { font-size: 11px; color: #aaa; }

    /* URL input row */
    .url-row {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
    }
    .url-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .url-row input:focus { border-color: #3182ce; }
    .url-row button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: #3182ce;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .url-row button:hover { background: #2563eb; }
    .url-row button:disabled { background: #a0aec0; cursor: not-allowed; }

    /* Preview image */
    #preview {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 10px;
      border: 1.5px solid #e2e8f0;
      display: none;
      margin-bottom: 1.25rem;
    }

    /* Results */
    .results-box {
      display: none;
      background: #f7fafc;
      border-radius: 12px;
      padding: 1.25rem;
      margin-top: 0.5rem;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }

    .results-title {
      font-size: 13px;
      font-weight: 600;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .infer-time {
      font-size: 11px;
      color: #888;
      background: #e2e8f0;
      padding: 2px 8px;
      border-radius: 99px;
    }

    /* Each prediction row */
    .pred-row {
      margin-bottom: 1rem;
    }
    .pred-row:last-child { margin-bottom: 0; }

    .pred-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 5px;
    }

    .pred-rank {
      font-size: 11px;
      font-weight: 700;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 6px;
      flex-shrink: 0;
    }
    .rank-1 { background: #fef9c3; color: #854d0e; }
    .rank-2 { background: #e2e8f0; color: #4a5568; }
    .rank-3 { background: #fce7f3; color: #9d174d; }

    .pred-name {
      font-size: 14px;
      font-weight: 500;
      color: #1a202c;
      flex: 1;
    }

    .pred-pct {
      font-size: 13px;
      font-weight: 600;
      color: #555;
      min-width: 44px;
      text-align: right;
    }

    .bar-track {
      background: #e2e8f0;
      border-radius: 99px;
      height: 10px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s ease;
    }

    /* Error box */
    .error-box {
      display: none;
      background: #fff5f5;
      border: 1.5px solid #feb2b2;
      border-radius: 10px;
      padding: 0.75rem 1rem;
      font-size: 13px;
      color: #c53030;
      margin-top: 0.5rem;
    }

    /* Footer */
    .footer {
      margin-top: 1.5rem;
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="container">

  <h1>MobileNet Classifier</h1>
  <p class="subtitle">TensorFlow.js &mdash; Top 3 ImageNet Predictions &mdash; Runs in Browser</p>

  <!-- Model status badge -->
  <span class="badge badge-loading" id="badge">⏳ Loading model...</span>

  <!-- Drop zone (click to upload) -->
  <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
    <div class="icon">🖼️</div>
    <p>Click or drag &amp; drop an image</p>
    <small>JPG &nbsp;·&nbsp; PNG &nbsp;·&nbsp; WEBP &nbsp;·&nbsp; GIF</small>
  </div>
  <input type="file" id="fileInput" accept="image/*" style="display:none;" />

  <!-- URL input -->
  <div class="url-row">
    <input type="text" id="urlInput" placeholder="Or paste a public image URL here…" />
    <button id="urlBtn" onclick="classifyFromURL()" disabled>Load & Classify</button>
  </div>

  <!-- Image preview -->
  <img id="preview" alt="Preview" crossorigin="anonymous" />

  <!-- Results -->
  <div class="results-box" id="resultsBox">
    <div class="results-header">
      <span class="results-title">Top 3 Predictions</span>
      <span class="infer-time" id="inferTime"></span>
    </div>
    <div id="predList"></div>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Footer -->
  <div class="footer">
    Model: MobileNet V2 &nbsp;|&nbsp; 1,000 ImageNet classes &nbsp;|&nbsp; No data leaves your device
  </div>

</div>

<script>
  /*
  ============================================================
    MobileNet Image Classifier
    Steps:
      1. Load MobileNet model from TF Hub (via CDN)
      2. Accept image via file upload or public URL
      3. Run model.classify() → get top-3 predictions
      4. Render results with animated confidence bars
  ============================================================
  */

  // ── Color palette for top-3 bars ──────────────────────────
  const BAR_COLORS = ['#3182ce', '#38a169', '#d69e2e'];

  // ── DOM references ─────────────────────────────────────────
  const badge      = document.getElementById('badge');
  const dropZone   = document.getElementById('dropZone');
  const fileInput  = document.getElementById('fileInput');
  const urlInput   = document.getElementById('urlInput');
  const urlBtn     = document.getElementById('urlBtn');
  const preview    = document.getElementById('preview');
  const resultsBox = document.getElementById('resultsBox');
  const predList   = document.getElementById('predList');
  const inferTime  = document.getElementById('inferTime');
  const errorBox   = document.getElementById('errorBox');

  let model = null;

  // ── Step 1: Load MobileNet ─────────────────────────────────
  async function loadModel() {
    setBadge('loading', '⏳ Loading MobileNet...');
    try {
      model = await mobilenet.load();
      setBadge('ready', '✅ Model ready');
      urlBtn.disabled = false;
      console.log('MobileNet loaded successfully!');
    } catch (err) {
      setBadge('loading', '❌ Load failed');
      showError('Failed to load MobileNet. Check your internet connection.');
    }
  }

  // ── Step 2a: Classify from file upload ─────────────────────
  fileInput.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      preview.onload = () => classifyImage(preview);
      preview.src = ev.target.result;
      preview.style.display = 'block';
      hideError();
    };
    reader.readAsDataURL(file);
  });

  // ── Step 2b: Classify from URL ─────────────────────────────
  function classifyFromURL() {
    const url = urlInput.value.trim();
    if (!url) return showError('Please enter a valid image URL.');
    hideError();
    preview.onload  = () => classifyImage(preview);
    preview.onerror = () => showError('Could not load image. Make sure the URL is correct and publicly accessible.');
    preview.src = url;
    preview.style.display = 'block';
  }

  // ── Step 3: Run inference ──────────────────────────────────
  async function classifyImage(imgElement) {
    if (!model) return showError('Model is still loading. Please wait.');
    setBadge('busy', '🔍 Classifying...');
    resultsBox.style.display = 'none';
    predList.innerHTML = '';

    try {
      const t0 = performance.now();

      // core call — returns top-3 predictions
      const predictions = await model.classify(imgElement, 3);

      const elapsed = (performance.now() - t0).toFixed(0);
      inferTime.textContent = `Inference: ${elapsed} ms`;

      // ── Step 4: Render results ─────────────────────────────
      renderPredictions(predictions);
      setBadge('ready', '✅ Model ready');
    } catch (err) {
      showError('Classification failed: ' + err.message);
      setBadge('ready', '✅ Model ready');
    }
  }

  // ── Render top-3 predictions ───────────────────────────────
  function renderPredictions(predictions) {
    predList.innerHTML = '';

    predictions.forEach((pred, index) => {
      const pct      = (pred.probability * 100).toFixed(1);
      const label    = pred.className.split(',')[0]; // shorten compound labels
      const color    = BAR_COLORS[index];
      const rankClass = ['rank-1','rank-2','rank-3'][index];

      const row = document.createElement('div');
      row.className = 'pred-row';
      row.innerHTML = `
        <div class="pred-meta">
          <span class="pred-rank ${rankClass}">${index + 1}</span>
          <span class="pred-name">${label}</span>
          <span class="pred-pct">${pct}%</span>
        </div>
        <div class="bar-track">
          <div class="bar-fill" id="bar-${index}"
               style="width: 0%; background: ${color};"></div>
        </div>
      `;
      predList.appendChild(row);

      // animate bar after a short delay
      setTimeout(() => {
        document.getElementById(`bar-${index}`).style.width = pct + '%';
      }, 80 * (index + 1));
    });

    resultsBox.style.display = 'block';
  }

  // ── Helpers ────────────────────────────────────────────────
  function setBadge(type, text) {
    badge.className = 'badge badge-' + type;
    badge.textContent = text;
  }

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }

  function hideError() {
    errorBox.style.display = 'none';
  }

  // drag & drop support
  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.style.background = '#ebf8ff';
    dropZone.style.borderColor = '#3182ce';
  });

  dropZone.addEventListener('dragleave', () => {
    dropZone.style.background = '';
    dropZone.style.borderColor = '';
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.style.background = '';
    dropZone.style.borderColor = '';
    const file = e.dataTransfer.files[0];
    if (file && file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        preview.onload = () => classifyImage(preview);
        preview.src = ev.target.result;
        preview.style.display = 'block';
        hideError();
      };
      reader.readAsDataURL(file);
    }
  });

  // Enter key on URL input
  urlInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') classifyFromURL();
  });

  // ── Boot ───────────────────────────────────────────────────
  loadModel();
</script>

</body>
</html>
