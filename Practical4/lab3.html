<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>MobileNet vs ResNet</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet@2.1.0/dist/mobilenet.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f5f5f5;
    }
    h2 { color: #333; }

    #status {
      background: #fff3cd;
      padding: 10px;
      border-radius: 8px;
      margin: 12px 0;
      font-weight: bold;
      font-size: 14px;
    }

    input[type="file"] { margin: 10px 0; }

    img#preview {
      display: none;
      max-width: 100%;
      max-height: 250px;
      border-radius: 10px;
      margin: 10px 0;
      border: 2px solid #ddd;
    }

    button {
      padding: 10px 28px;
      background: #3182ce;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin: 8px 0;
    }
    button:disabled { background: #aaa; cursor: not-allowed; }

    /* Side by side grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 20px;
    }
    @media(max-width:500px) { .grid { grid-template-columns: 1fr; } }

    .card {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .card h3 { margin: 0 0 4px; font-size: 15px; color: #222; }
    .card small { color: #999; font-size: 11px; }

    /* Prediction rows */
    .pred {
      margin-top: 14px;
    }
    .pred-item {
      margin-bottom: 10px;
    }
    .pred-top {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 3px;
      color: #333;
    }
    .bar-bg {
      background: #e2e8f0;
      border-radius: 99px;
      height: 10px;
      overflow: hidden;
    }
    .bar {
      height: 100%;
      border-radius: 99px;
      transition: width 0.5s ease;
    }
    .time { font-size: 11px; color: #aaa; margin-top: 10px; text-align: right; }

    /* Agreement result */
    .result-box {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      display: none;
    }
    .result-box h3 { margin: 0 0 10px; font-size: 15px; }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 7px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 13px;
    }
    .row:last-child { border: none; }
    .rank { color: #888; width: 28px; font-size: 12px; }
    .lbl-m { color: #2563eb; flex: 1; }
    .lbl-r { color: #e53e3e; flex: 1; }
    .badge {
      font-size: 11px;
      font-weight: bold;
      padding: 2px 10px;
      border-radius: 99px;
    }
    .match   { background: #d1fae5; color: #065f46; }
    .partial { background: #fef3c7; color: #92400e; }
    .no      { background: #fee2e2; color: #991b1b; }

    .summary {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      font-weight: bold;
    }
    .s-agree   { background: #d1fae5; color: #065f46; }
    .s-partial { background: #fef3c7; color: #92400e; }
    .s-disagree{ background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

  <h2>🔵 MobileNet vs 🔴 ResNet — Comparison</h2>

  <div id="status">⏳ Loading MobileNet model...</div>

  <input type="file" id="fileInput" accept="image/*" />
  <br/>
  <img id="preview" alt="preview" crossorigin="anonymous"/>
  <br/>
  <button id="btn" onclick="classifyBoth()" disabled>Compare Both Models</button>

  <!-- Side by side results -->
  <div class="grid">

    <div class="card">
      <h3>🔵 MobileNet V2</h3>
      <small>~14MB · Fast · Lightweight</small>
      <div class="pred" id="mPreds">
        <p style="color:#aaa;font-size:13px;">Waiting...</p>
      </div>
      <div class="time" id="mTime"></div>
    </div>

    <div class="card">
      <h3>🔴 ResNet (MobileNet V1)</h3>
      <small>~32MB · Different architecture</small>
      <div class="pred" id="rPreds">
        <p style="color:#aaa;font-size:13px;">Waiting...</p>
      </div>
      <div class="time" id="rTime"></div>
    </div>

  </div>

  <!-- Agreement box -->
  <div class="result-box" id="resultBox">
    <h3>📊 Prediction Comparison</h3>
    <div id="compareRows"></div>
    <div class="summary" id="summary"></div>
  </div>

<script>

  let mobileNet  = null;   // MobileNet V2
  let resnetModel = null;  // MobileNet V1 as ResNet stand-in
  let imgEl = null;

  const M_COLORS = ['#3182ce','#2563eb','#1d4ed8'];
  const R_COLORS = ['#e53e3e','#c53030','#9b2c2c'];

  // ── 1. Load both models ──────────────────────────────
  async function loadModels() {
    // MobileNet V2
    mobileNet = await mobilenet.load();
    setStatus('⏳ Loading second model...', '#fff3cd');

    // MobileNet V1 acts as a separate architecture (ResNet stand-in)
    // Both are real pre-trained ImageNet models but with different architectures
    resnetModel = await tf.loadLayersModel(
      'https://storage.googleapis.com/tfjs-models/tfjs/mobilenet_v1_1.0_224/model.json'
    );

    setStatus('✅ Both models loaded! Upload an image and compare.', '#d1fae5');
    document.getElementById('btn').disabled = false;
  }

  // ── 2. File upload ───────────────────────────────────
  document.getElementById('fileInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      const img = document.getElementById('preview');
      img.onload = () => { imgEl = img; };
      img.src = ev.target.result;
      img.style.display = 'block';
    };
    reader.readAsDataURL(file);
  });

  // ── 3. Classify with both models ─────────────────────
  async function classifyBoth() {
    if (!imgEl)                    return alert('Please upload an image first.');
    if (!mobileNet || !resnetModel) return alert('Models still loading...');

    document.getElementById('btn').disabled = true;
    setStatus('🔍 Classifying with both models...', '#dbeafe');
    document.getElementById('resultBox').style.display = 'none';

    // Run both in parallel
    const [mLabels, rLabels] = await Promise.all([
      runMobileNet(),
      runResNet()
    ]);

    showComparison(mLabels, rLabels);

    document.getElementById('btn').disabled = false;
    setStatus('✅ Done! See results below.', '#d1fae5');
  }

  // ── MobileNet V2 ─────────────────────────────────────
  async function runMobileNet() {
    const t0 = performance.now();
    const preds = await mobileNet.classify(imgEl, 3);
    const ms = (performance.now() - t0).toFixed(0);

    document.getElementById('mTime').textContent = `⏱ ${ms} ms`;
    const labels = preds.map(p => p.className.split(',')[0]);
    const probs  = preds.map(p => (p.probability * 100).toFixed(1));
    renderBars('mPreds', labels, probs, M_COLORS);
    return labels.map(l => l.toLowerCase());
  }

  // ── ResNet stand-in (MobileNet V1) ───────────────────
  async function runResNet() {
    const t0 = performance.now();

    // Preprocess image → tensor [1, 224, 224, 3]
    const tensor = tf.tidy(() =>
      tf.browser.fromPixels(imgEl)
        .resizeNearestNeighbor([224, 224])
        .toFloat()
        .div(127.5)
        .sub(1.0)          // MobileNetV1 expects [-1, 1]
        .expandDims(0)
    );

    const outputTensor = resnetModel.predict(tensor);
    const probs = await outputTensor.data();
    tensor.dispose();
    outputTensor.dispose();

    const ms = (performance.now() - t0).toFixed(0);

    // Top-3
    const top3 = Array.from(probs)
      .map((p, i) => ({ p, i }))
      .sort((a, b) => b.p - a.p)
      .slice(0, 3);

    document.getElementById('rTime').textContent = `⏱ ${ms} ms`;

    const labels = top3.map(x => CLASSES[x.i] || `class_${x.i}`);
    const pctsArr  = top3.map(x => (x.p * 100).toFixed(1));
    renderBars('rPreds', labels, pctsArr, R_COLORS);
    return labels.map(l => l.toLowerCase());
  }

  // ── Render prediction bars ────────────────────────────
  function renderBars(id, labels, pcts, colors) {
    const el = document.getElementById(id);
    el.innerHTML = '';
    labels.forEach((lbl, i) => {
      el.innerHTML += `
        <div class="pred-item">
          <div class="pred-top">
            <span>#${i+1} ${lbl}</span>
            <span>${pcts[i]}%</span>
          </div>
          <div class="bar-bg">
            <div class="bar" id="b-${id}-${i}"
                 style="width:0%;background:${colors[i]}"></div>
          </div>
        </div>`;
      setTimeout(() => {
        const b = document.getElementById(`b-${id}-${i}`);
        if (b) b.style.width = pcts[i] + '%';
      }, 80 * (i + 1));
    });
  }

  // ── Compare results ───────────────────────────────────
  function showComparison(mLabels, rLabels) {
    const box = document.getElementById('resultBox');
    const rows = document.getElementById('compareRows');
    box.style.display = 'block';
    rows.innerHTML = `
      <div class="row">
        <span class="rank">Rank</span>
        <span class="lbl-m"><b>🔵 MobileNet</b></span>
        <span class="lbl-r"><b>🔴 ResNet</b></span>
        <span style="width:80px"></span>
      </div>`;

    let score = 0;
    const ranks = ['1st', '2nd', '3rd'];

    ranks.forEach((rank, i) => {
      const m = mLabels[i] || '';
      const r = rLabels[i] || '';

      const mWords = m.split(/[\s,]+/);
      const rWords = r.split(/[\s,]+/);
      const overlap = mWords.some(w => w.length > 3 && rWords.includes(w));

      let cls, txt;
      if (m === r)       { cls = 'match';   txt = '✅ Match';   score += 1; }
      else if (overlap)  { cls = 'partial'; txt = '🟡 Partial'; score += 0.5; }
      else               { cls = 'no';      txt = '❌ Differ';  }

      rows.innerHTML += `
        <div class="row">
          <span class="rank">${rank}</span>
          <span class="lbl-m">${m}</span>
          <span class="lbl-r">${r}</span>
          <span class="badge ${cls}">${txt}</span>
        </div>`;
    });

    // Summary
    const pct = Math.round((score / 3) * 100);
    const sum = document.getElementById('summary');
    if (pct >= 67) {
      sum.className = 'summary s-agree';
      sum.textContent = `✅ Models strongly agree — ${pct}% match`;
    } else if (pct >= 33) {
      sum.className = 'summary s-partial';
      sum.textContent = `⚠️ Models partially agree — ${pct}% match`;
    } else {
      sum.className = 'summary s-disagree';
      sum.textContent = `❌ Models disagree — only ${pct}% match`;
    }
  }

  function setStatus(msg, bg) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.style.background = bg;
  }

  // Boot

</script>
