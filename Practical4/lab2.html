<!DOCTYPE html>
<html>
<head>
<title>MobileNet Accuracy Test</title>

<!-- TensorFlow.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<!-- MobileNet Model -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/mobilenet"></script>

</head>

<body>

<h2>MobileNet Image Classification Accuracy Test</h2>

<input type="file" id="images" multiple>
<br><br>

<button onclick="testImages()">Test Images</button>

<h3>Results:</h3>
<div id="output"></div>

<script>

let model;
let correct = 0;
let total = 0;

// Load model
async function loadModel(){
    model = await mobilenet.load();
    console.log("Model Loaded");
}

loadModel();

async function testImages(){

    const files = document.getElementById("images").files;
    const output = document.getElementById("output");

    correct = 0;
    total = files.length;
    output.innerHTML = "";

    for(let i=0;i<files.length;i++){

        const img = document.createElement("img");
        img.src = URL.createObjectURL(files[i]);
        img.width = 200;

        await new Promise(resolve => img.onload = resolve);

        const predictions = await model.classify(img);

        const predicted = predictions[0].className;

        const actual = prompt("Enter actual label for image "+(i+1));

        if(predicted.toLowerCase().includes(actual.toLowerCase())){
            correct++;
        }

        output.innerHTML += `
        <p>
        Image ${i+1} <br>
        Predicted: ${predicted}<br>
        Actual: ${actual}
        </p>
        <hr>
        `;
    }

    const accuracy = (correct/total)*100;

    output.innerHTML += `<h3>Accuracy: ${accuracy.toFixed(2)}%</h3>`;
}

</script>

</body>
</html>
