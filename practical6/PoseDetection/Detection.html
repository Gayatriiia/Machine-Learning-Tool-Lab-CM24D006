<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PoseNet — Body Pose Detection</title>

  <!-- TensorFlow.js & PoseNet -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/posenet@2.2.2/dist/posenet.min.js"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --neon: #00ffe7;
      --accent: #ff2d78;
      --bg: #07090f;
      --panel: rgba(255,255,255,0.03);
      --border: rgba(0,255,231,0.15);
      --text: #c8d6e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 40px;
      overflow-x: hidden;
    }

    /* Scanline overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: 0.15em;
      color: var(--neon);
      text-shadow: 0 0 12px rgba(0,255,231,0.5), 0 0 30px rgba(0,255,231,0.2);
      text-transform: uppercase;
    }

    header p {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.78rem;
      color: rgba(200,214,229,0.5);
      margin-top: 6px;
      letter-spacing: 0.08em;
    }

    /* Canvas wrapper */
    .viewport {
      position: relative;
      width: 100%;
      max-width: 680px;
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 0 1px rgba(0,255,231,0.05), 0 0 40px rgba(0,255,231,0.06);
    }

    .viewport::before {
      content: 'LIVE';
      position: absolute;
      top: 10px; left: 14px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent);
      letter-spacing: 0.12em;
      z-index: 10;
      text-shadow: 0 0 8px var(--accent);
    }

    #videoEl {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;          /* hidden — canvas mirrors it */
      transform: scaleX(-1);
    }

    #canvas {
      display: block;
      width: 100%;
      height: auto;
      transform: scaleX(-1);  /* mirror for selfie view */
    }

    /* Stats bar */
    .stats {
      display: flex;
      gap: 20px;
      margin-top: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 18px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.78rem;
      letter-spacing: 0.06em;
      color: rgba(200,214,229,0.7);
      min-width: 120px;
      text-align: center;
    }

    .stat-box span {
      display: block;
      font-size: 1.2rem;
      color: var(--neon);
      text-shadow: 0 0 8px rgba(0,255,231,0.5);
      margin-top: 2px;
    }

    /* Keypoints legend */
    .legend {
      display: flex;
      gap: 18px;
      margin-top: 18px;
      flex-wrap: wrap;
      justify-content: center;
      font-size: 0.75rem;
      font-family: 'Share Tech Mono', monospace;
      letter-spacing: 0.04em;
      color: rgba(200,214,229,0.5);
    }

    .legend-dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    /* Status message */
    #status {
      margin-top: 18px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: var(--neon);
      letter-spacing: 0.08em;
      min-height: 20px;
      text-align: center;
      text-shadow: 0 0 8px rgba(0,255,231,0.4);
    }

    /* Loading animation */
    @keyframes blink {
      0%,100% { opacity:1; } 50% { opacity:0.2; }
    }
    .blink { animation: blink 1s infinite; }
  </style>
</head>
<body>

<header>
  <h1>&#9632; PoseNet Detector</h1>
  <p>Real-time human body pose estimation · TensorFlow.js</p>
</header>

<div class="viewport">
  <video id="videoEl" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div class="stats">
  <div class="stat-box">KEYPOINTS<span id="kpCount">—</span></div>
  <div class="stat-box">CONFIDENCE<span id="score">—</span></div>
  <div class="stat-box">FPS<span id="fps">—</span></div>
</div>

<div class="legend">
  <span><span class="legend-dot" style="background:#00ffe7;"></span>High confidence</span>
  <span><span class="legend-dot" style="background:#ff2d78;"></span>Low confidence</span>
  <span><span class="legend-dot" style="background:rgba(255,255,255,0.3);"></span>Skeleton</span>
</div>

<div id="status"><span class="blink">▌</span> Initialising model…</div>

<script>
  const video   = document.getElementById('videoEl');
  const canvas  = document.getElementById('canvas');
  const ctx     = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const kpEl    = document.getElementById('kpCount');
  const scoreEl = document.getElementById('score');
  const fpsEl   = document.getElementById('fps');

  // ---- colour palette ----
  const COL_HIGH    = '#00ffe7';
  const COL_LOW     = '#ff2d78';
  const COL_SKEL    = 'rgba(255,255,255,0.25)';
  const COL_JOINT_BG= 'rgba(7,9,15,0.7)';

  // PoseNet skeleton pairs
  const SKELETON = [
    ['leftShoulder','rightShoulder'],
    ['leftShoulder','leftElbow'],   ['leftElbow','leftWrist'],
    ['rightShoulder','rightElbow'], ['rightElbow','rightWrist'],
    ['leftShoulder','leftHip'],     ['rightShoulder','rightHip'],
    ['leftHip','rightHip'],
    ['leftHip','leftKnee'],         ['leftKnee','leftAnkle'],
    ['rightHip','rightKnee'],       ['rightKnee','rightAnkle'],
    ['nose','leftEye'],             ['nose','rightEye'],
    ['leftEye','leftEar'],          ['rightEye','rightEar'],
  ];

  let net = null;
  let lastTime = performance.now();
  let frameCount = 0;

  async function setupCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: 640, height: 480 },
      audio: false
    });
    video.srcObject = stream;
    return new Promise(res => { video.onloadedmetadata = () => res(video); });
  }

  function keypointByName(kps, name) {
    return kps.find(k => k.part === name);
  }

  function drawSkeleton(keypoints) {
    const kpMap = {};
    keypoints.forEach(k => { kpMap[k.part] = k; });

    ctx.strokeStyle = COL_SKEL;
    ctx.lineWidth   = 1.5;

    SKELETON.forEach(([a, b]) => {
      const ka = kpMap[a], kb = kpMap[b];
      if (!ka || !kb) return;
      if (ka.score < 0.3 || kb.score < 0.3) return;

      ctx.beginPath();
      ctx.moveTo(ka.position.x, ka.position.y);
      ctx.lineTo(kb.position.x, kb.position.y);
      ctx.stroke();
    });
  }

  function drawKeypoints(keypoints) {
    keypoints.forEach(kp => {
      if (kp.score < 0.3) return;
      const { x, y } = kp.position;
      const col = kp.score > 0.6 ? COL_HIGH : COL_LOW;
      const r   = kp.score > 0.6 ? 5 : 4;

      // Glow
      ctx.shadowColor = col;
      ctx.shadowBlur  = 10;

      // Background dot
      ctx.beginPath();
      ctx.arc(x, y, r + 2, 0, 2 * Math.PI);
      ctx.fillStyle = COL_JOINT_BG;
      ctx.fill();

      // Coloured dot
      ctx.beginPath();
      ctx.arc(x, y, r, 0, 2 * Math.PI);
      ctx.fillStyle = col;
      ctx.fill();

      ctx.shadowBlur = 0;
    });
  }

  async function detectLoop() {
    if (!net) return;

    const pose = await net.estimateSinglePose(video, {
      flipHorizontal: false,
      decodingMethod: 'single-person'
    });

    // Mirror canvas to match video display
    canvas.width  = video.videoWidth;
    canvas.height = video.videoHeight;

    // Draw mirrored video frame
    ctx.save();
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    // Overlay skeleton & keypoints
    drawSkeleton(pose.keypoints);
    drawKeypoints(pose.keypoints);

    // Update stats
    const visKP = pose.keypoints.filter(k => k.score > 0.3).length;
    kpEl.textContent    = `${visKP} / ${pose.keypoints.length}`;
    scoreEl.textContent = (pose.score * 100).toFixed(1) + '%';

    frameCount++;
    const now = performance.now();
    if (now - lastTime >= 1000) {
      fpsEl.textContent = frameCount;
      frameCount = 0;
      lastTime = now;
    }

    requestAnimationFrame(detectLoop);
  }

  async function main() {
    try {
      statusEl.innerHTML = '<span class="blink">▌</span> Requesting camera access…';
      await setupCamera();
      video.play();

      statusEl.innerHTML = '<span class="blink">▌</span> Loading PoseNet model…';
      net = await posenet.load({
        architecture: 'MobileNetV1',
        outputStride: 16,
        inputResolution: { width: 640, height: 480 },
        multiplier: 0.75
      });

      statusEl.textContent = '● Model ready — detecting poses';
      detectLoop();
    } catch (err) {
      statusEl.style.color = '#ff2d78';
      statusEl.textContent = '✖ Error: ' + err.message;
      console.error(err);
    }
  }

  main();
</script>
</body>
</html>
