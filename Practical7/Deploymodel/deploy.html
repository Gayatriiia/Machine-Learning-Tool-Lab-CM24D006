<!DOCTYPE html>
<html>
<head>
  <title>Model Deployment in Browser</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
</head>
<body>
  <h2>Model Deployment Demo</h2>
  <button onclick="trainModel()">Train & Save Model</button>
  <button onclick="loadModel()">Load Model</button>
  <button onclick="predict()">Predict</button>

  <p id="output"></p>

  <script>
    let model;

    // Step 1: Create and Train Model
    async function trainModel() {
      model = tf.sequential();

      model.add(tf.layers.dense({units: 1, inputShape: [1]}));
      model.compile({
        loss: 'meanSquaredError',
        optimizer: 'sgd'
      });

      // Training Data: y = 2x
      const xs = tf.tensor2d([1, 2, 3, 4], [4, 1]);
      const ys = tf.tensor2d([2, 4, 6, 8], [4, 1]);

      await model.fit(xs, ys, {epochs: 200});

      // Step 2: Save model locally (browser storage)
      await model.save('localstorage://my-model');

      document.getElementById("output").innerText = "Model trained and saved!";
    }

    // Step 3: Load Saved Model
    async function loadModel() {
      model = await tf.loadLayersModel('localstorage://my-model');
      document.getElementById("output").innerText = "Model loaded!";
    }

    // Step 4: Predict using loaded model
    function predict() {
      if (!model) {
        alert("Load model first!");
        return;
      }

      const input = tf.tensor2d([5], [1, 1]);
      const result = model.predict(input);

      result.array().then(res => {
        document.getElementById("output").innerText =
          "Prediction for x=5: " + res[0][0];
      });
    }
  </script>
</body>
</html>
