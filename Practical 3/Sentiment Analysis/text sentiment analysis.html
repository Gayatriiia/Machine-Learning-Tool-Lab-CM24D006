<!DOCTYPE html>
<html>
<head>
<title>Sentiment Analysis</title>

<!-- TensorFlow.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>

</head>

<body>

<h2>Text Sentiment Analysis</h2>

<input type="text" id="text" placeholder="Enter text here">
<button onclick="analyze()">Analyze</button>

<p id="result"></p>

<script>

function analyze() {

let text = document.getElementById("text").value.toLowerCase()

let positiveWords = ["good","happy","great","love","excellent","nice","amazing"]
let negativeWords = ["bad","sad","hate","terrible","poor","worst"]

let score = 0

positiveWords.forEach(word=>{
if(text.includes(word)) score++
})

negativeWords.forEach(word=>{
if(text.includes(word)) score--
})

let result = ""

if(score > 0){
result = "Positive Sentiment 😊"
}
else if(score < 0){
result = "Negative Sentiment 😞"
}
else{
result = "Neutral Sentiment 😐"
}

document.getElementById("result").innerHTML = result

}

</script>

</body>
</html>
