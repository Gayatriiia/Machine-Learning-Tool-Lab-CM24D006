<!DOCTYPE html>
<html>
<head>
<title>Sentiment Test</title>

<!-- TensorFlow.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

</head>

<body>

<h2>Sentiment Analysis Test</h2>

<button onclick="trainModel()">Train Model</button>
<p id="status"></p>

<br><br>

<input type="text" id="inputText" placeholder="Enter sentence">
<button onclick="predictSentiment()">Predict</button>

<p id="result"></p>

<script>

let model

// Training data
const sentences = [
"I love this product",
"This is amazing",
"I feel very happy",
"This movie is great",
"I hate this product",
"This is terrible",
"I feel very sad",
"This movie is bad"
]

const labels = [1,1,1,1,0,0,0,0]

// Feature extraction
function feature(text){

let positive = ["love","amazing","happy","great"]
let negative = ["hate","bad","sad","terrible"]

let score = 0

positive.forEach(w=>{
if(text.toLowerCase().includes(w)) score++
})

negative.forEach(w=>{
if(text.toLowerCase().includes(w)) score--
})

return score
}

const xs = tf.tensor2d(sentences.map(s=>[feature(s)]))
const ys = tf.tensor2d(labels.map(l=>[l]))

async function trainModel(){

model = tf.sequential()

model.add(tf.layers.dense({units:1,inputShape:[1],activation:'sigmoid'}))

model.compile({
optimizer:'adam',
loss:'binaryCrossentropy'
})

document.getElementById("status").innerHTML="Training..."

await model.fit(xs,ys,{epochs:50})

document.getElementById("status").innerHTML="Training Complete"

}

function predictSentiment(){

let text=document.getElementById("inputText").value

let f=feature(text)

let input=tf.tensor2d([[f]])

let prediction=model.predict(input)

let score=prediction.dataSync()[0]

let sentiment=""
if(score>0.5){
sentiment="Positive 😊"
}
else{
sentiment="Negative 😞"
}

document.getElementById("result").innerHTML =
"Sentiment: "+sentiment+"<br>Confidence Score: "+score.toFixed(2)

}

</script>

</body>
</html>
