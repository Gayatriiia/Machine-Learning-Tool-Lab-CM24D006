<!DOCTYPE html>
<html>
<head>
<title>Sentiment Classifier</title>

<!-- TensorFlow.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

</head>

<body>

<h2>Sentiment Classifier</h2>

<button onclick="train()">Train Model</button>
<p id="status"></p>

<br>

<input type="text" id="sentence" placeholder="Enter a sentence">
<button onclick="predict()">Predict</button>

<p id="output"></p>

<script>

let model

// Dataset
const sentences = [
"I love this product",
"This is amazing",
"I feel very happy",
"This movie is great",
"I hate this",
"This is bad",
"I feel sad",
"This is terrible"
]

// Labels
const labels = [1,1,1,1,0,0,0,0]

// Feature: number of positive words
function extractFeature(text){
let positive = ["love","amazing","happy","great"]
let negative = ["hate","bad","sad","terrible"]

let score = 0

positive.forEach(w=>{
if(text.toLowerCase().includes(w)) score++
})

negative.forEach(w=>{
if(text.toLowerCase().includes(w)) score--
})

return score
}

// Prepare tensors
let xs = tf.tensor2d(sentences.map(s=>[extractFeature(s)]))
let ys = tf.tensor2d(labels.map(l=>[l]))

async function train(){

model = tf.sequential()

model.add(tf.layers.dense({units:1,inputShape:[1],activation:'sigmoid'}))

model.compile({
optimizer:'adam',
loss:'binaryCrossentropy'
})

document.getElementById("status").innerHTML="Training..."

await model.fit(xs,ys,{epochs:60})

document.getElementById("status").innerHTML="Training Completed"

}

function predict(){

let text=document.getElementById("sentence").value

let feature=extractFeature(text)

let input=tf.tensor2d([[feature]])

let prediction=model.predict(input)

let result=prediction.dataSync()[0]

if(result>0.5){
document.getElementById("output").innerHTML="Positive 😊"
}
else{
document.getElementById("output").innerHTML="Negative 😞"
}

}

</script>

</body>
</html>
